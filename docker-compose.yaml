services:
  postgres:
    image: postgres:16
    container_name: restaurant-api-postgres
    restart: always
    environment:
      POSTGRES_DB: restaurant_api
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
