spring:
  application:
    name: restaurant-reservation

  datasource:
    url: jdbc:postgresql://localhost:5434/restaurant_api
    username: ${DB_USERNAME:admin}
    password: ${DB_USERPASS:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081