spring:
  application:
    name: restaurant-reservation

  datasource:
    url: jdbc:postgresql://localhost:5434/restaurant_api
    username: ${DB_USERNAME:admin}
    password: ${DB_USERPASS:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8081